name: Docker image

on:
  push:
    branches: ["main", "dokploy"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Host installer image: the default target, which carries the Docker CLI and
  # the Compose plugin.
  publish:
    if: github.ref != 'refs/heads/dokploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tiunov2008/vpnforge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Dokploy image: the slim runtime target. Publishing it is what lets the
  # Dokploy stack pull instead of building on the server at every deploy.
  publish-dokploy:
    if: github.ref == 'refs/heads/dokploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tiunov2008/vpnforge
          tags: |
            type=raw,value=dokploy
            type=sha,prefix=dokploy-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Deployment is triggered here rather than by Dokploy's own git webhook:
      # that fires the moment the branch is pushed, which is before the image
      # above exists, so the nodes would quietly redeploy the previous one.
      # Requires "Pull latest images on deploy" to be enabled on each service.
      - name: Trigger Dokploy deployments
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_IDS: ${{ secrets.DOKPLOY_COMPOSE_IDS }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_URL:-}" ] || [ -z "${DOKPLOY_API_KEY:-}" ] \
             || [ -z "${DOKPLOY_COMPOSE_IDS:-}" ]; then
            echo "Dokploy deploy secrets not set; image published, nothing triggered."
            exit 0
          fi
          failed=0
          for id in ${DOKPLOY_COMPOSE_IDS//,/ }; do
            echo "::group::deploy $id"
            status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H "x-api-key: ${DOKPLOY_API_KEY:-}" \
              -H 'Content-Type: application/json' \
              -d "{\"composeId\":\"${id}\",\"title\":\"CI ${GITHUB_SHA::7}\"}" \
              "${DOKPLOY_URL%/}/api/compose.deploy") || status=000
            cat response.json || true
            echo
            if [ "$status" != "200" ]; then
              echo "::error::$id returned HTTP $status"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
