services:
  hysteria:
    image: tobyxdd/hysteria:v2
    container_name: vpnforge-hysteria
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      HYSTERIA_DISABLE_UPDATE_CHECK: "1"
    command: ["server", "-c", "/etc/hysteria/config.yaml"]
    volumes:
      - ${VPNFORGE_RUNTIME_DIR:-/var/lib/vpnforge}/generated/hysteria/config.yaml:/etc/hysteria/config.yaml:ro
      - ${VPNFORGE_RUNTIME_DIR:-/var/lib/vpnforge}/generated/hysteria/cert:/etc/hysteria/cert:ro
