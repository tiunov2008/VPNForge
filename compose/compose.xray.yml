services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: vpnforge-xray
    restart: unless-stopped
    command: ["run", "-config", "/etc/xray/config.json"]
    networks:
      - vpnforge
    ports:
      - "${VPNFORGE_XRAY_REALITY_PORT:-443}:443"
      - "${VPNFORGE_XRAY_TLS_PORT:-8443}:8443"
    volumes:
      - ${VPNFORGE_RUNTIME_DIR:-/var/lib/vpnforge}/generated/xray/config.json:/etc/xray/config.json:ro
      - ${VPNFORGE_RUNTIME_DIR:-/var/lib/vpnforge}/generated/xray/cert:/etc/xray/cert:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
