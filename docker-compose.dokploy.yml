services:
  # Runs once per deploy. Turns the Dokploy Environment tab into rendered
  # configs and generates the secrets, both into named volumes so they survive
  # the repository being re-cloned on every deploy.
  init:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["dokploy", "bootstrap"]
    restart: "no"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the Dokploy Environment tab}
      EMAIL: ${EMAIL:-}
      SUBSCRIPTION_TITLE: ${SUBSCRIPTION_TITLE:-VPNForge}
      FINGERPRINT: ${FINGERPRINT:-firefox}
      ENABLE_XRAY: ${ENABLE_XRAY:-true}
      ENABLE_HYSTERIA: ${ENABLE_HYSTERIA:-true}
      HYSTERIA_PORT_RANGE: ${HYSTERIA_PORT_RANGE:-20000-32000}
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT:-80}
      XRAY_REALITY_PORT: ${XRAY_REALITY_PORT:-2053}
      XRAY_TLS_PORT: ${XRAY_TLS_PORT:-8443}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      VPNFORGE_CONFIG_DIR: /etc/vpnforge
      VPNFORGE_RUNTIME_DIR: /var/lib/vpnforge
      VPNFORGE_TLS_DIR: /tls
      VPNFORGE_ACME_JSON: /acme/acme.json
    volumes:
      - vpnforge-config:/etc/vpnforge
      - vpnforge-runtime:/var/lib/vpnforge
      - vpnforge-tls:/tls
      # Directory, never the file: Traefik replaces acme.json in place and a
      # single-file bind would pin the old inode. A missing path would also be
      # created as an empty directory, which would break Traefik.
      - ${DOKPLOY_TRAEFIK_DYNAMIC:-/etc/dokploy/traefik/dynamic}:/acme:ro

  # Copies the certificate Traefik obtained for this domain out of acme.json
  # into the shared volume that nginx, xray and hysteria read.
  certs:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ["dokploy", "certs", "--watch", "--interval", "${CERT_POLL_INTERVAL:-60}"]
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the Dokploy Environment tab}
      VPNFORGE_CONFIG_DIR: /etc/vpnforge
      VPNFORGE_RUNTIME_DIR: /var/lib/vpnforge
      VPNFORGE_TLS_DIR: /tls
      VPNFORGE_ACME_JSON: /acme/acme.json
    volumes:
      - vpnforge-config:/etc/vpnforge
      - vpnforge-runtime:/var/lib/vpnforge
      - vpnforge-tls:/tls
      - ${DOKPLOY_TRAEFIK_DYNAMIC:-/etc/dokploy/traefik/dynamic}:/acme:ro

  # Serves the subscription site and is the fallback target for both Xray
  # inbounds. Attach the Dokploy Domain to THIS service, port 80, HTTPS on:
  # Traefik terminating TLS for the domain is what makes it request the
  # certificate the certs service then re-uses.
  nginx:
    image: nginx:stable-alpine3.24-perl
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    # Hysteria re-reads its certificate on every handshake and Xray re-checks
    # its files hourly, but nginx only reads them at startup -- so it would
    # keep serving the self-signed placeholder on the Xray fallback listeners
    # long after Traefik issued the real certificate. Reload on a timer.
    # No shell variables here on purpose: ${...} is substituted by Compose
    # before the container ever sees it, so the script contains no '$' that a
    # shell could reinterpret.
    command:
      - /bin/sh
      - -ec
      - |
        nginx -c /var/lib/vpnforge/generated/nginx/nginx.conf -t
        (
          while sleep ${NGINX_RELOAD_INTERVAL:-900}; do
            nginx -c /var/lib/vpnforge/generated/nginx/nginx.conf -s reload || true
          done
        ) &
        exec nginx -c /var/lib/vpnforge/generated/nginx/nginx.conf -g 'daemon off;'
    expose:
      # Container port only -- the host 80 belongs to Traefik.
      - "${NGINX_HTTP_PORT:-80}"
    volumes:
      - vpnforge-runtime:/var/lib/vpnforge:ro
      - vpnforge-tls:/etc/nginx/tls:ro

  xray:
    image: ghcr.io/xtls/xray-core:latest
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command:
      ["run", "-config", "/var/lib/vpnforge/generated/xray/config.json"]
    ports:
      # Traefik owns 443, so REALITY listens on an alternate host port.
      - "${XRAY_REALITY_PORT:-2053}:443"
      - "${XRAY_TLS_PORT:-8443}:8443"
    volumes:
      - vpnforge-runtime:/var/lib/vpnforge:ro
      - vpnforge-tls:/etc/xray/cert:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # Opt-in via COMPOSE_PROFILES=hysteria.
  # Host networking is required: publishing a UDP port range through Docker
  # spawns one docker-proxy per port and will not start. This service must
  # never be given a Dokploy Domain -- Dokploy would inject a networks: key and
  # Compose rejects that alongside network_mode.
  hysteria:
    image: tobyxdd/hysteria:v2
    profiles: ["hysteria"]
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      HYSTERIA_DISABLE_UPDATE_CHECK: "1"
    command:
      ["server", "-c", "/var/lib/vpnforge/generated/hysteria/config.yaml"]
    volumes:
      - vpnforge-runtime:/var/lib/vpnforge:ro
      - vpnforge-tls:/etc/hysteria/cert:ro

volumes:
  vpnforge-config:
  vpnforge-runtime:
  vpnforge-tls:
